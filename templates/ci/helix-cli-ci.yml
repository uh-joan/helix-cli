name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test

# To activate: place this at .github/workflows/ci.yml in the helix-cli repo.
# Pushing workflow files needs a token with the `workflow` scope
# (gh auth refresh -h github.com -s workflow), or add it via the GitHub web UI.
